name: Install
description: Set up Node and pnpm, then install dependencies with Electron's download cached.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - id: electron
      shell: bash
      run: echo "version=$(grep -m1 -oE '^  electron@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
    # The postinstall downloads Electron from GitHub releases, which sometimes answers 504.
    - uses: actions/cache@v6
      with:
        path: ~/Library/Caches/electron
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
    - shell: bash
      run: |
        for attempt in 1 2 3; do
          pnpm install --frozen-lockfile && exit 0
          echo "::warning::pnpm install failed (attempt $attempt), retrying"
          sleep $((attempt * 15))
        done
        exit 1
